<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="arena-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="arena-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="arena-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="46" height="46" rx="13" fill="url(#arena-bg-grad)" filter="url(#arena-glow)" />
    <rect x="1" y="1" width="44" height="44" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
    
    <!-- Hexagonal Arena Wall -->
    <path d="M23 6L38 14.5V31.5L23 40L8 31.5V14.5L23 6Z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.9" />
    
    <!-- Central Core Nexus -->
    <circle cx="23" cy="23" r="4.2" fill="#FFFFFF" />

    <!-- Connecting Utility Radii -->
    <path d="M23 8.5V18.8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M23 27.2V37.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M10.5 16L19.5 21" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M26.5 25L35.5 30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M10.5 30L19.5 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M26.5 21L35.5 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Cyan & Gold Tech Accents -->
    <circle cx="15" cy="18" r="1.8" fill="#38BDF8" />
    <circle cx="31" cy="28" r="1.8" fill="#38BDF8" />
    <circle cx="15" cy="28" r="1.8" fill="#FDE047" />
    <circle cx="31" cy="18" r="1.8" fill="#FDE047" />
  </g>

  <!-- Typography -->
  <text x="60" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">Tool</text>
  <text x="114" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="url(#arena-text-grad)" letter-spacing="-0.03em">Arena</text>

  <!-- Cyan Spark Accent Dot -->
  <circle cx="188" cy="32" r="3.2" fill="#06B6D4" />
</svg>
