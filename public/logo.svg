<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="logo-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="logo-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E40AF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="46" height="46" rx="13" fill="url(#logo-bg-grad)" filter="url(#logo-glow)" />
    <rect x="1" y="1" width="44" height="44" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
    
    <!-- Central Hub Circle -->
    <circle cx="23" cy="23" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- Left Tool Prong -->
    <path d="M11 20C11 16 14 13 18 13L21 16L17 20L13 20C11.8954 20 11 20 11 20Z" fill="#FFFFFF" fill-opacity="0.95" />
    <path d="M12 23H18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M11 26C11 30 14 33 18 33L21 30L17 26L13 26C11.8954 26 11 26 11 26Z" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Right Dynamic Spark -->
    <path d="M25 12L34 21H28L31 34L22 25H28L25 12Z" fill="url(#logo-spark-grad)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="60" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">Tool</text>
  <text x="114" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="url(#logo-text-grad)" letter-spacing="-0.03em">Hub</text>

  <!-- Dynamic Dot Accent -->
  <circle cx="168" cy="32" r="3" fill="#06B6D4" />
</svg>
